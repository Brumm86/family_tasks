# --- Administrative services (v0.72, services.py) ---
create_task:
  fields:
    task:
      required: true
      example:
        name: "Take out the paper recycling"
        points: 5
        coin_value: 1
        due_time: "18:00"
        recurrence: {"type": "weekly", "weekdays": [2]}
        rotation: {"member_ids": ["<member_id>"], "strategy": "fixed"}
      selector:
        object:

update_task:
  fields:
    task_id:
      required: true
      selector:
        text:
    changes:
      required: true
      example:
        points: 8
        due_time: "17:30"
      selector:
        object:

delete_task:
  fields:
    task_id:
      required: true
      selector:
        text:

list_tasks:
  fields:
    include_status:
      selector:
        boolean:

create_member:
  fields:
    member:
      required: true
