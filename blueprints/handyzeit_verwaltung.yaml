blueprint:
  name: Handyzeit-Verwaltung (Family Link + family_tasks-Belohnungen)
  description: >-
    Verwaltet das tägliche Handyzeit-Guthaben eines Kindes über die
    Google-Family-Link-Integration: Reset um Mitternacht, automatische
    Erhöhung zu festen Uhrzeiten, manuelle Plus-/Minus-Buttons (nur für
    Admin-Accounts) und sofortige Erhöhung, sobald das Kind im
    family_tasks-Punkte-Shop eine Belohnung mit "Zusätzliche Bildschirmzeit
    in Minuten" einlöst (Event family_tasks_reward_redeemed). Eine Instanz
    pro Kind - neues Kind = neue Automatisierung aus diesem Blueprint mit
    eigenen Werten, keine Logikänderung nötig.

    Die automatischen Zeit-Ticks pausieren, solange entweder der
    Pause-Schalter unten manuell "aus" ist, ODER solange family_tasks für
    dieses Kind eine überfällige Pflichtaufgabe ("TASK_KIND_MANDATORY")
    führt - siehe "family_tasks: Handyzeitgewährung-aktiv-Sensor" unten.
    Beide Bedingungen wirken unabhängig voneinander und betreffen
    ausschließlich die automatischen Ticks, nicht die manuellen Buttons
    und nicht Belohnungs-Einlösungen.

    Optional (neu, v0.36) lässt sich die Erhöhung pro automatischem Tick
    zusätzlich an den Wochenfortschritt koppeln: siehe "family_tasks:
    Wochenfortschritt-Sensor für Tick-Anpassung" unten - hat ein Kind in der
    Vorwoche noch nicht mindestens 50% seines Wochenziels erreicht (v0.45.1:
    beurteilt wird immer die bereits abgeschlossene Vorwoche, nie die noch
    laufende - ein Rückstand wirkt sich also erst in der Folgewoche aus),
    fällt jeder Tick um 2 Minuten kleiner aus, ab 50% um 1 Minute, ab 100%
    unverändert.

    Optional (neu, testweise) lässt sich zusätzlich ein input_number
    angeben, in den bei jeder Neuberechnung derselbe Wert geschrieben
    wird, der sonst an Google gemeldet wird ("family_tasks:
    Verfügbarkeits-Zähler (Test)" unten) - rein additiv, verändert die
    bestehende Google-Anbindung nicht, dient nur dem Vergleich mit den
    von Google ermittelten Werten.

    Optional (neu, v0.67) lässt sich außerdem ein Ausgleich für einen
    bekannten Google-Family-Link-Fehler aktivieren: Google rechnet auf das
    Tageslimit mehr Zeit an, als das Kind mit Apps verbracht hat, die
    tatsächlich gegen das Limit zählen sollen - nämlich die Nutzung
    "immer erlaubter" Apps sowie Zeit, die keiner App zugeordnet ist
    (z. B. Telefonate). Siehe "family_tasks: Ausgleich ..." unten. Alle 5
    Minuten wird die von Google angerechnete Nutzung (`used_minutes`) mit
    der Summe der Nutzung aller Apps verglichen, die NICHT "immer erlaubt"
    sind (Tages-Nutzungs-Sensor abzüglich der Liste der immer erlaubten
    Apps). Die positive Differenz, abzüglich der heute bereits
    gutgeschriebenen Minuten, wird zum aktuellen Limit addiert - nie mehr,
    als Google selbst über die zählende Nutzung hinaus anrechnet. Daten
    vom Vortag (Sensoren, die nach Mitternacht noch nicht neu geladen
    wurden) werden nie verwendet, und nach jeder Anpassung wartet die
    Automatisierung, bis der Tageslimit-Sensor den neuen Wert zeigt,
    damit ein nachfolgender Tick nicht auf einem veralteten Limit
    aufsetzt. Zu beachten: ob eine App zählt, richtet sich immer nach der
    aktuellen Liste der immer erlaubten Apps - wird eine App im Tagesverlauf
    in diese Liste aufgenommen oder aus ihr entfernt, wird auch ihre
    bereits früher am selben Tag angefallene Nutzung entsprechend
    behandelt. Außerdem gilt jede nicht einer App zugeordnete Minute als
    Fehlmessung; Rundungsabweichungen lassen sich über den optionalen
    Mindest-Fehlbetrag unten ausblenden. Behebt Google den Fehler eines
    Tages, wird die Differenz dauerhaft 0 und der Ausgleich nie mehr
    aktiv.
  domain: automation
  input:
    child_name:
      name: Name des Kindes
      description: Nur für Alias/Benachrichtigungstexte.
      selector:
        text:

    member_id:
      name: family_tasks Mitglieds-ID
      description: >-
        Die interne Mitglieds-ID in der family_tasks-Integration - siehe
        Attribut "member_id" am Punkte-Sensor des Mitglieds
        (sensor.<name>_punkte). Wird gegen event_data.member_id aus
        family_tasks_reward_redeemed verglichen.
      selector:
        text:

    switch_entity:
      name: Family-Link-Schalter
      selector:
        entity:
          domain: switch

    daily_limit_sensor:
      name: Family-Link-Tageslimit-Sensor
      selector:
        entity:
          domain: sensor

    button_entities:
      name: Plus-/Minus-Buttons (beide zusammen, für den Trigger)
      description: >-
        Leer lassen, solange es für dieses Kind noch keine Buttons gibt -
        der Buttons-Trigger bleibt dann einfach untätig, der Rest
        (Zeitplan, Reset, Belohnungs-Event) funktioniert unverändert.
      default: []
      selector:
        entity:
          domain: input_button
          multiple: true

    plus_button_entity:
      name: "davon: Plus-Button"
      description: Muss auch oben in "Plus-/Minus-Buttons" enthalten sein.
      default: ""
      selector:
        entity:
          domain: input_button

    minus_button_entity:
      name: "davon: Minus-Button"
      description: Muss auch oben in "Plus-/Minus-Buttons" enthalten sein.
      default: ""
      selector:
        entity:
          domain: input_button

    admin_user_ids:
      name: Admin-User-IDs
      description: >-
        Diese HA-Nutzer dürfen die Buttons bedienen - alle anderen werden
        geblockt und per persistent_notification gemeldet. Es gibt bewusst
        keinen Standardwert: hier müssen die HA-User-IDs der Admin-Accounts
        eingetragen werden (Einstellungen > Personen > Benutzer), sonst ist
        niemand berechtigt.
      default: []
      selector:
        text:
          multiple: true

    automation_toggle_entity:
      name: Pause-Schalter für die automatischen Zeit-Ticks
      description: >-
        input_boolean, das nur die zeitgesteuerten Plus-Ticks pausiert,
        wenn "aus". Betrifft NICHT die manuellen Buttons und NICHT
        Belohnungs-Einlösungen - beide wirken immer sofort, unabhängig von
        diesem Schalter. Rein manuell bedient - wird von dieser
        Automatisierung selbst nirgends automatisch umgeschaltet (auch
        nicht vom Pflichtaufgaben-Sensor unten, siehe dessen Beschreibung).
      default: input_boolean.handyzeit_automation
      selector:
        entity:
          domain: input_boolean

    screen_time_grant_active_entity:
      name: "family_tasks: Handyzeitgewährung-aktiv-Sensor (optional)"
      description: >-
        Der von der family_tasks-Integration automatisch je Mitglied
        angelegte binary_sensor "<Name> Handyzeitgewährung aktiv"
        (screen_time_grant_active in coordinator.py/binary_sensor.py) -
        wird "aus", solange dieses Kind mindestens eine überfällige
        Pflichtaufgabe ("TASK_KIND_MANDATORY") hat, und automatisch
        wieder "an", sobald sie erledigt bzw. von einem Elternteil
        bestätigt ist. Pausiert die automatischen Zeit-Ticks zusätzlich
        zum Pause-Schalter oben, unabhängig davon - beide Bedingungen
        werden mit ODER verknüpft, jede für sich reicht zum Pausieren.
        Bewusst ein separater Sensor statt eines Spiegelns in den
        Pause-Schalter selbst: so bleibt ein manuell gesetzter
        Pause-Schalter unberührt, wenn eine Pflichtaufgabe zwischendurch
        erledigt wird, und umgekehrt. Leer lassen, um Pflichtaufgaben für
        dieses Kind nicht zu berücksichtigen (z. B. wenn es keine hat).
      default: ""
      selector:
        entity:
          domain: binary_sensor

    plus_times:
      name: Automatische Plus-Uhrzeiten
      description: >-
        Seit v0.45 lässt sich die Anzahl der hier eingetragenen Uhrzeiten
        zusätzlich in den family_tasks-Integrationsoptionen unter
        "Automatische Ticks pro Tag" hinterlegen - rein informativ, siehe
        "Erhöhung pro Tick" oben. Auch hier: manuell synchron halten, wenn
        sich die Liste hier ändert.
      default:
        - "07:20:00"
        - "08:00:00"
        - "09:00:00"
        - "10:00:00"
        - "11:00:00"
        - "12:00:00"
        - "13:00:00"
        - "14:00:00"
        - "15:00:00"
        - "16:00:00"
        - "17:00:00"
        - "18:00:00"
        - "19:00:00"
        - "20:00:00"
        - "21:15:00"
      selector:
        text:
          multiple: true

    increment_minutes:
      name: Erhöhung pro Tick (Minuten)
      description: >-
        Gilt für automatische Zeit-Ticks und für beide Buttons (ein
        einziger Wert, damit "Plus-Button fügt X hinzu" nie wieder vom
        tatsächlichen Wert abweichen kann). Wirkt sich NICHT auf
        Belohnungs-Einlösungen aus - dort zählt direkt der
        screen_time_minutes-Wert aus dem Event.

        Seit v0.45 lässt sich derselbe Wert zusätzlich in den
        family_tasks-Integrationsoptionen unter "Handyzeit pro
        automatischem Tick (Minuten)" hinterlegen - rein informativ, damit
        die Karte die voraussichtliche tägliche Handyzeit anzeigen und
        erklären kann. Diese Automatisierung liest ihn NICHT von dort,
        beide Werte müssen also manuell synchron gehalten werden, wenn
        dieser Wert hier geändert wird.
      default: 7
      selector:
        number:
          min: 1
          max: 60
          mode: box

    screen_time_tick_adjustment_source_entity:
      name: "family_tasks: Wochenfortschritt-Sensor für Tick-Anpassung (optional)"
      description: >-
        Der Punkte-Sensor dieses Kindes in family_tasks (sensor.<name>_punkte)
        - trägt das Attribut "screen_time_tick_adjustment_minutes"
        (MemberSummaryData.screen_time_tick_adjustment_minutes in
        coordinator.py): -2, solange dieses Kind in der Vorwoche noch keine
        50% seines Wochenziels erreicht hat, -1 ab 50%, 0 ab 100%
        (v0.45.1: beurteilt wird immer die abgeschlossene Vorwoche, ein
        Rückstand wirkt sich also erst in der Folgewoche aus; in der ersten
        Woche, für die noch keine beurteilbare Vorwoche existiert, ist der
        Wert 0). Wird nur auf automatische Zeit-Ticks angewendet (Trigger "plus_tick"),
        NICHT auf die manuellen Buttons und NICHT auf
        Belohnungs-Einlösungen - beide zählen weiterhin unverändert den
        vollen Wert. Die effektive Erhöhung pro Tick (Erhöhung pro Tick
        oben plus diese Anpassung) wird nie unter 0 Minuten gekürzt. Leer
        lassen, um jeden Tick unverändert mit "Erhöhung pro Tick" laufen zu
        lassen (z. B. wenn für dieses Kind kein Wochenziel konfiguriert
        ist).
      default: ""
      selector:
        entity:
          domain: sensor

    screen_time_remaining_sensor:
      name: "family_tasks: Ausgleich - Screen-Time-Remaining-Sensor (optional, v0.67)"
      description: >-
        Der von der Google-Family-Link-Integration je Gerät zusätzlich zum
        Tageslimit-Sensor bereitgestellte "...Screen Time Remaining"-Sensor
        desselben Kindes/Geräts. Sein Attribut "used_minutes" ist die von
        Google tatsächlich auf das Tageslimit angerechnete Nutzung
        (ungedeckelt, unabhängig vom zuletzt gesetzten Limit) und damit die
        Vergleichsgröße des Ausgleichs. Teil der Pflicht-Eingänge des
        Ausgleichs (siehe Blueprint-Beschreibung oben); leer lassen
        deaktiviert ihn.
      default: ""
      selector:
        entity:
          domain: sensor

    available_time_counter:
      name: "family_tasks: Verfügbarkeits-Zähler (Test, optional)"
      description: >-
        Rein additiv, testweise (siehe Blueprint-Beschreibung oben): ein
        input_number, in das bei jeder Neuberechnung zusätzlich derselbe
        Wert geschrieben wird, der auch an Google gemeldet wird
        (daily_minutes). Verändert nichts an der bestehenden
        Google-Anbindung, dient nur der parallelen Beobachtung. Leer
        lassen (Standard), um wie bisher nur an Google zu melden.
      default: ""
      selector:
        entity:
          domain: input_number

    daily_screen_time_sensor:
      name: "family_tasks: Ausgleich - Tages-Nutzungs-Sensor (optional, v0.67)"
      description: >-
        Der von der Google-Family-Link-Integration je Kind bereitgestellte
        "...Daily Screen Time"-Sensor - trägt im Attribut "apps" die heutige
        Nutzung jeder einzelnen App in Minuten. Zusammen mit dem
        Immer-erlaubte-Apps-Sensor die Grundlage für die "Korrekte
        Nutzungszeit" des Ausgleichs. Leer lassen deaktiviert den Ausgleich.
      default: ""
      selector:
        entity:
          domain: sensor

    always_allowed_apps_sensor:
      name: "family_tasks: Ausgleich - Immer-erlaubte-Apps-Sensor (optional, v0.67)"
      description: >-
        Der von der Google-Family-Link-Integration je Kind bereitgestellte
        "...Always Allowed Apps"-Sensor - trägt im Attribut "apps" die Liste
        der von der Sperre ausgenommenen Apps. Deren Nutzung zählt nicht zur
        "Korrekten Nutzungszeit". Leer lassen deaktiviert den Ausgleich.
      default: ""
      selector:
        entity:
          domain: sensor

    correction_credited_helper:
      name: "family_tasks: Ausgleich - bereits gutgeschrieben (optional, v0.67)"
      description: >-
        Ein input_number, in dem diese Automatisierung merkt, wie viele
        Minuten sie dem heutigen Limit bereits als Ausgleich gutgeschrieben
        hat - verhindert, dass derselbe Fehlbetrag alle 5 Minuten erneut
        aufaddiert wird. Wird um Mitternacht automatisch auf 0 gesetzt.
        Empfohlen: Minimum 0, Maximum 1440, Schrittweite 1 (ein zu kleines
        Maximum lässt die Gutschrift scheitern; dann wird nichts am Limit
        geändert). Pflicht-Eingang des Ausgleichs: ohne diesen Helfer bleibt
        der Ausgleich aus Sicherheitsgründen deaktiviert.
      default: ""
      selector:
        entity:
          domain: input_number

    correction_count_helper:
      name: "family_tasks: Ausgleich - Zähler (optional, v0.67)"
      description: >-
        Ein counter-Helfer, der bei jeder tatsächlich vorgenommenen
        Gutschrift um 1 erhöht wird - rein zur Beobachtung, ob und wie oft
        der Fehler noch auftritt. Wird nie zurückgesetzt. Leer lassen, um
        auf den Zähler zu verzichten.
      default: ""
      selector:
        entity:
          domain: counter

    correction_min_gap_minutes:
      name: "family_tasks: Ausgleich - Mindest-Fehlbetrag in Minuten (optional, v0.67)"
      description: >-
        Neu gutgeschrieben wird erst, wenn der noch nicht ausgeglichene
        Fehlbetrag mindestens so groß ist. 1 (Standard) gleicht jede Minute
        aus; ein höherer Wert blendet kleine Rundungsabweichungen zwischen
        Googles Gesamtwert und der Summe der Pro-App-Minuten aus (der
        Fehlbetrag wird dann gebündelt gutgeschrieben, sobald er die
        Schwelle erreicht).
      default: 1
      selector:
        number:
          min: 1
          max: 30
          mode: box
          step: 1

triggers:
  - id: reset
    trigger: time
    at: "00:00:00"
  - id: plus_tick
    trigger: time
    at: !input plus_times
  - id: buttons
    trigger: state
    entity_id: !input button_entities
  - id: family_event
    trigger: event
    event_type: family_tasks_reward_redeemed
  - id: correction_check
    trigger: time_pattern
    minutes: "/5"

conditions: []

actions:
  - variables:
      child_name: !input child_name
      member_id: !input member_id
      daily_limit_sensor: !input daily_limit_sensor
      plus_button_entity: !input plus_button_entity
      minus_button_entity: !input minus_button_entity
      admin_user_ids: !input admin_user_ids
      automation_toggle_entity: !input automation_toggle_entity
      screen_time_grant_active_entity: !input screen_time_grant_active_entity
      increment_minutes: !input increment_minutes
      screen_time_tick_adjustment_source_entity: !input screen_time_tick_adjustment_source_entity
      screen_time_remaining_sensor: !input screen_time_remaining_sensor
      available_time_counter: !input available_time_counter
      daily_screen_time_sensor: !input daily_screen_time_sensor
      always_allowed_apps_sensor: !input always_allowed_apps_sensor
      correction_credited_helper: !input correction_credited_helper
      correction_count_helper: !input correction_count_helper
      correction_min_gap_minutes: !input correction_min_gap_minutes

  # Frühe Ausstiege, bevor überhaupt eine neue Handyzeit berechnet wird -
  # derselbe "stop"-Stil wie in der ursprünglichen Automation.
  - choose:
      - conditions:
          - condition: template
            value_template: |-
              {{ trigger.id == 'buttons'
                 and (trigger.to_state.context.user_id | default('')) not in admin_user_ids }}
        sequence:
          - action: persistent_notification.create
            data:
              title: "Handyzeit-Button blockiert (Nicht-Admin)"
              message: >-
                Ein Nicht-Admin hat versucht, die Handyzeit von {{ child_name }} zu ändern.
                Zeit: {{ now().strftime('%Y-%m-%d %H:%M:%S') }}
                Button: {{ trigger.entity_id }}
                user_id: {{ trigger.to_state.context.user_id | default('unbekannt') }}
              notification_id: "handyzeit_{{ member_id }}_blockiert"
          - stop: "Ignoriert: Button wurde von Nicht-Admin ausgelöst."

      # v2: zweite Pausier-Quelle neben dem manuellen Pause-Schalter -
      # siehe screen_time_grant_active_entity oben. "| default('') != ''"
      # macht den Sensor optional, ohne bei leerem Input einen unnötigen
      # states()-Aufruf mit leerer Entity-ID auszulösen.
      - conditions:
          - condition: template
            value_template: |-
              {{ trigger.id == 'plus_tick'
                 and (states(automation_toggle_entity) == 'off'
                      or (screen_time_grant_active_entity | default('') != ''
                          and states(screen_time_grant_active_entity) == 'off')) }}
        sequence:
          - stop: >-
              Ignoriert: automatischer Plus-Tick bei deaktiviertem
              Pause-Schalter oder überfälliger Pflichtaufgabe
              (family_tasks Handyzeitgewährung-aktiv-Sensor).

      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'family_event'
                 and (trigger.event.data.member_id != member_id
                      or trigger.event.data.screen_time_minutes is none) }}
        sequence:
          - stop: "Ignoriert: Belohnungs-Event betrifft ein anderes Kind oder trägt keine Bildschirmzeit-Minuten."

      # v0.67: Ausgleich der von Google zu Unrecht auf das Tageslimit
      # angerechneten Zeit (alle 5 Minuten) - eigener, unabhängiger Zweig,
      # läuft unabhängig von Pause-Schalter/Pflichtaufgaben-Sensor (keine
      # Bonuszeit, nur Ausgleich eines Mess-/Zurechnungsfehlers) und endet
      # immer mit "stop", berührt also nie die normale Tick-/Button-/
      # Belohnungs-Logik unten.
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'correction_check' }}"
        sequence:
          - if:
              - condition: template
                value_template: >-
                  {{ screen_time_remaining_sensor | default('') == ''
                     or daily_screen_time_sensor | default('') == ''
                     or always_allowed_apps_sensor | default('') == ''
                     or correction_credited_helper | default('') == '' }}
            then:
              - stop: "Ausgleich nicht vollständig konfiguriert (vier Pflicht-Eingänge) - nichts zu tun."
          # Nur mit frischen, vollständigen Daten rechnen: Sensoren, die nach
          # Mitternacht noch nicht neu geladen wurden, zeigen noch den Vortag
          # (-> sonst würde dessen Fehlbetrag dem neuen Tag gutgeschrieben).
          - variables:
              midnight_ts: "{{ as_timestamp(today_at('00:00')) }}"
              data_valid: >-
                {{ states(screen_time_remaining_sensor) not in ['unknown', 'unavailable']
                   and states(daily_screen_time_sensor) not in ['unknown', 'unavailable']
                   and states(always_allowed_apps_sensor) not in ['unknown', 'unavailable']
                   and states(correction_credited_helper) not in ['unknown', 'unavailable']
                   and state_attr(screen_time_remaining_sensor, 'used_minutes') is not none
                   and state_attr(daily_screen_time_sensor, 'apps') is not none
                   and state_attr(always_allowed_apps_sensor, 'apps') is not none
                   and as_timestamp(states[screen_time_remaining_sensor].last_updated, 0) >= midnight_ts
                   and as_timestamp(states[daily_screen_time_sensor].last_updated, 0) >= midnight_ts }}
          - if:
              - condition: template
                value_template: "{{ not data_valid }}"
            then:
              - stop: "Ausgleich übersprungen: Sensordaten fehlen, sind nicht verfügbar oder stammen noch vom Vortag."
          - variables:
              allowed_pkgs: >-
                {{ (state_attr(always_allowed_apps_sensor, 'apps') or [])
                   | map(attribute='package') | list }}
              relevant_minutes: >-
                {{ (((state_attr(daily_screen_time_sensor, 'apps') or [])
                    | rejectattr('package', 'in', allowed_pkgs)
                    | sum(attribute='minutes'))) | round(0, 'ceil') | int(0) }}
              google_used_minutes: >-
                {{ state_attr(screen_time_remaining_sensor, 'used_minutes') | int(0) }}
              gap_now: "{{ [google_used_minutes - relevant_minutes, 0] | max }}"
              already_credited: "{{ states(correction_credited_helper) | float(0) | round(0) | int(0) }}"
              open_gap: "{{ gap_now - already_credited }}"
              correction_delta: >-
                {{ open_gap if open_gap >= (correction_min_gap_minutes | int(1)) else 0 }}
          - if:
              - condition: template
                value_template: "{{ correction_delta > 0 }}"
            then:
              - variables:
                  correction_new_limit: "{{ (states(daily_limit_sensor) | int(0)) + correction_delta }}"
              # Zuerst den Zähler fortschreiben: scheitert er (z. B. Maximum
              # des Helfers zu klein), bleibt das Limit unverändert, statt
              # denselben Fehlbetrag bei jedem Lauf erneut gutzuschreiben.
              - action: input_number.set_value
                target:
                  entity_id: "{{ correction_credited_helper }}"
                data:
                  value: "{{ gap_now }}"
              - action: familylink.set_daily_limit
                data:
                  entity_id: !input switch_entity
                  daily_minutes: "{{ correction_new_limit }}"
              # Auf den Tageslimit-Sensor warten (mode: queued - alle
              # folgenden Läufe warten hier mit), damit ein nachfolgender Tick
              # oder Button nicht auf dem alten, noch nicht aktualisierten
              # Wert aufsetzt und die Gutschrift überschreibt.
              - wait_template: "{{ (states(daily_limit_sensor) | int(0)) >= correction_new_limit }}"
                timeout: "00:02:00"
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: "{{ correction_count_helper | default('') != '' }}"
                then:
                  - action: counter.increment
                    target:
                      entity_id: "{{ correction_count_helper }}"
              - action: logbook.log
                data:
                  name: "Handyzeit-Ausgleich ({{ child_name }})"
                  message: >-
                    Fehlerhaft angerechnete Zeit ausgeglichen: +{{ correction_delta }}
                    Min. (Google used_minutes {{ google_used_minutes }}, zählende
                    Nutzung {{ relevant_minutes }} Min., heute insgesamt
                    ausgeglichen {{ gap_now }} Min.; Limit-Sensor
                    {{ 'bestätigt' if (states(daily_limit_sensor) | int(0)) >= correction_new_limit else 'hat den neuen Wert noch nicht bestätigt' }}.)
                  entity_id: !input switch_entity
          - stop: >-
              Ende des Ausgleichs-Checks (Trigger "correction_check") -
              unabhängig von der normalen Tick-/Button-/Belohnungs-Logik unten.

  - variables:
      daily_minutes: >-
        {% set current = states(daily_limit_sensor) | int(0) %}
        {% if trigger.id == 'reset' %}
          {{ 0 }}
        {% elif trigger.id == 'plus_tick' %}
          {% set adjustment = (state_attr(screen_time_tick_adjustment_source_entity, 'screen_time_tick_adjustment_minutes') | int(0)) if (screen_time_tick_adjustment_source_entity | default('') != '') else 0 %}
          {% set tick_increment = [(increment_minutes | int) + adjustment, 0] | max %}
          {{ current + tick_increment }}
        {% elif trigger.id == 'buttons' and trigger.entity_id == plus_button_entity %}
          {{ current + (increment_minutes | int) }}
        {% elif trigger.id == 'buttons' and trigger.entity_id == minus_button_entity %}
          {{ [current - (increment_minutes | int), 0] | max }}
        {% elif trigger.id == 'family_event' %}
          {{ current + (trigger.event.data.screen_time_minutes | int) }}
        {% else %}
          {{ current }}
        {% endif %}

  - action: familylink.set_daily_limit
    data:
      entity_id: !input switch_entity
      daily_minutes: "{{ daily_minutes }}"

  # v0.67: bereits gutgeschriebene Ausgleichs-Minuten täglich zurücksetzen,
  # damit der Ausgleich am neuen Tag wieder bei 0 anfängt.
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'reset' and correction_credited_helper | default('') != '' }}
        sequence:
          - action: input_number.set_value
            target:
              entity_id: "{{ correction_credited_helper }}"
            data:
              value: 0

  # Optional (testweise): denselben Wert zusätzlich in einen input_number
  # schreiben - siehe available_time_counter oben.
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ available_time_counter | default('') != '' }}"
        sequence:
          - action: input_number.set_value
            target:
              entity_id: "{{ available_time_counter }}"
            data:
              value: "{{ daily_minutes }}"

mode: queued
max: 10
